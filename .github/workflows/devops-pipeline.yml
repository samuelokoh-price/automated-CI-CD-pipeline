name: CI/CD Calculator Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      # CHANGE 1: added 'working-directory' so pip finds requirements.txt inside app/
      working-directory: ./Aesthetic-Calculator-main
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Tests
      # CHANGE 2: added 'working-directory' so your tests run inside the app folder
      working-directory: ./Aesthetic-Calculator-main
      run: |
        echo "No tests configured yet. Passing phase..."

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build local Docker image
      uses: docker/build-push-action@v5
      with:
        # CHANGE 3: Pointed the context and file paths directly to my app directory
        context: ./Aesthetic-Calculator-main
        file: ./Aesthetic-Calculator-main/Dockerfile
        push: false 
